[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback (harmless for this single-page app, future-proof for routing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker or the app shell aggressively; hashed assets
# under /assets are safe to cache forever.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
